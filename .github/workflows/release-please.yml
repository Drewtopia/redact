# Keeps one release PR open that bumps Cargo.toml, Cargo.lock and plugin.json and
# adds to CHANGELOG.md. Merging it tags a draft release, and the build below fills it.
# release-please acts as the redact-release GitHub App, not GITHUB_TOKEN: GitHub runs
# no workflows on a PR that GITHUB_TOKEN opens, so main's required checks would never
# report on the release PR. Repo variable RELEASE_APP_CLIENT_ID and secret
# RELEASE_APP_PRIVATE_KEY hold the App's credentials.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
