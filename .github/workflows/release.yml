# Builds redact for macOS, Linux and Windows when a v* tag is pushed, and attaches
# each binary (plus a sha256 checksum) to a GitHub release. Asset names carry the
# target triple, which is what `mise use github:Drewtopia/redact` matches on.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Third-party actions are pinned to a commit SHA (tag in the comment) because
# they run with write access to this repo's releases.
permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - uses: taiki-e/create-gh-release-action@045e5c0ed9c50cc1f96de7e891a09ad3daea245f # v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Draft until every binary is attached: mise's version mirror caches the
          # asset list of a published release, so a half-uploaded one breaks installs.
          draft: true

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: redact
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          include: LICENSE-MIT,LICENSE-APACHE,LICENSE-THIRD-PARTY
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
