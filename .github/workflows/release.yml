# Builds redact for macOS, Linux and Windows into the draft release that
# release-please made for a tag, then publishes it. release-please.yml calls this
# after a release PR merges; run it by hand with the tag to retry a failed build.
# Asset names carry the target triple, which is what `mise use github:Drewtopia/redact` matches on.
name: release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Release tag to build, such as v0.3.0

# Third-party actions are pinned to a commit SHA (tag in the comment) because
# they run with write access to this repo's releases.
permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Check the tag matches Cargo.toml and plugin.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cargo=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          plugin=$(jq -r .version claude-plugin/.claude-plugin/plugin.json)
          [ "v$cargo" = "$TAG" ] || { echo "tag $TAG is not Cargo.toml's v$cargo"; exit 1; }
          [ "v$plugin" = "$TAG" ] || { echo "tag $TAG is not plugin.json's v$plugin"; exit 1; }

  upload-assets:
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: redact
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          include: LICENSE-MIT,LICENSE-APACHE,LICENSE-THIRD-PARTY
          checksum: sha256
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # The release stays a draft until every binary is attached: mise's version mirror
  # caches the asset list of a published release, so a half-uploaded one breaks installs.
  publish-release:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
