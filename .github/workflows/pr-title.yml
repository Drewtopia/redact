# PRs are squash-merged with the title as the commit subject and the body as the
# rest of the message. release-please reads the title for the version bump and
# changelog, so it must parse, and the body lands on main as written. The message
# is checked against commit-check.toml, the policy the commit-msg hook uses.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Named for the required check on main. Also catches the redact mod's placeholder
  # text anywhere in the title or body (#81).
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install commit-check==2.19.5
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/squash-message"
          commit-check -m --no-banner "$RUNNER_TEMP/squash-message"
