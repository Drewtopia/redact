# PRs are squash-merged with the title as the commit subject and the body as the
# rest of the message. release-please reads the title for the version bump and
# changelog, so it must parse, and the body's trailers land on main as written.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # The redact mod can turn an agent's Co-Authored-By line into placeholder
  # text (#81), and the squash merge would carry it onto main.
  trailers:
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -qiE '^(co-authored-by|signed-off-by):.*\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]'; then
            echo "::error::A trailer in the PR body holds placeholder text, and the body becomes the commit message on main."
            exit 1
          fi

  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
