# redact config: ~/.config/redact/config.toml (%APPDATA%\redact\config.toml on Windows).
# Written by `redact config init --preset strict`: everything hidden, work names
# included. Commands and links that hold a work name will hold a placeholder.
# `redact config ls` shows what loads and why;
# `redact config init --preset commented --print` shows every setting.

# Hide who you are: your git name and email, and your GitHub login.
me = true

# Hide whatever these environment variables hold. `*` matches anything.
env = ["*_TOKEN", "*_KEY", "*_SECRET", "*_PASSWORD"]

# Hide every value in these dotenv files, relative to where redact runs.
env_files = [".env", ".env.local", ".env.keys"]

# Built-in packs: azure, identity, kubernetes, docker, npm, http, gcp, credentials,
# and two that start switched off and are on here: work (organisation, project,
# repo and host names) and pii (personal data: phone numbers, cards, IP addresses).
[packs]
enable = ["work", "pii"]

# Strict on one machine or in one folder only: leave [packs] out above and
# switch the packs on in an override instead.
# [[override]]
# host = "work-laptop"      # or dir = "~/dev/work"
# [override.packs]
# enable = ["work", "pii"]
