# Built-in pack: credentials in HTTP headers (curl -v, raw requests, HAR text).
schema_version = 1
id = "http"
description = "Cookie and Set-Cookie values, and API key headers such as Ocp-Apim-Subscription-Key and x-functions-key"
keywords = ["cookie", "-key", "api-key", "auth-token", "proxy-authorization"]

[[rules]]
id = "cookie"
description = "The value of a Cookie or Set-Cookie header (curl -v prefixes > and < are fine)"
regex = '''(?im)^[<>*]?[ \t]*(?:cookie|set-cookie)[ \t]*:[ \t]*(.+?)[ \t]*$'''
secretGroup = 1
label = "COOKIE"
keywords = ["cookie"]

[[rules]]
id = "key-header"
description = "API key headers: Ocp-Apim-Subscription-Key, x-functions-key, x-api-key, api-key, x-auth-token, x-goog-api-key, Proxy-Authorization"
regex = '''(?im)^[<>*]?[ \t]*(?:ocp-apim-subscription-key|x-functions-key|x-api-key|api-key|x-auth-token|x-goog-api-key|proxy-authorization)[ \t]*:[ \t]*(.+?)[ \t]*$'''
secretGroup = 1
label = "API-KEY"
