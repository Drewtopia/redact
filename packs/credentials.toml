# Built-in pack: credentials, wherever they appear.
# Two kinds of rule: a vendor's own key shape (found on sight), and a value whose
# name says it is a secret (TOKEN=, "password":, Authorization:). Values in an
# environment dump (`env`, `mise env`, `cat .env`) are hidden too.
#
# Several vendor shapes (the Entra client secret, Azure SAS and storage keys among
# them) follow the patterns in Ray Amjad's transcript-redactor
# (github.com/ray-amjad/claude-code-mods, MIT licence), rewritten for Rust's regex.
# The Groq, xAI and Google OAuth key lengths follow redact-transcripts' scrub rules
# (Apache-2.0); GitLab's and Stripe's follow gitleaks' rules. The Entra client
# secret's length before Q~ follows Betterleaks' rule (github.com/betterleaks/betterleaks).
schema_version = 1
id = "credentials"
description = "Tokens, keys and passwords: JWTs, bearer tokens, common vendor key shapes, private key blocks, passwords in URLs, values named as secrets, and environment dump values"

# Exact values left alone even when a rule below matches them: settings, not
# secrets. `NODE_ENV=development` keeps `development`; `"tokenType": "Bearer"`
# keeps the word `Bearer`. The token after `Bearer` in a header is still hidden.
allow = ["true", "false", "development", "production", "staging", "localhost", "debug", "info", "warning", "error", "Bearer"]

# --- On sight: the shape alone says what it is -----------------------------------

[[rules]]
id = "jwt"
description = "A JSON Web Token (header.payload.signature), e.g. an Azure access token"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])(eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})'''
secretGroup = 1
label = "SECRET"
keywords = ["eyj"]

[[rules.tests]]
input = "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJmYWtlIn0.ZmFrZXNpZ25hdHVyZTEyMzQ"
expect = ["eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJmYWtlIn0.ZmFrZXNpZ25hdHVyZTEyMzQ"]

[[rules]]
id = "bearer"
description = "The token after Bearer in an Authorization header"
regex = '''(?i)\bbearer\s+([A-Za-z0-9._~+/=-]{16,})'''
secretGroup = 1
label = "SECRET"
keywords = ["bearer"]

matrix = false
[[rules.tests]]
input = "Authorization: Bearer FakeBearerToken1234567890"
expect = ["FakeBearerToken1234567890"]

[[rules]]
id = "github-token"
description = "GitHub personal, OAuth, app and fine-grained tokens"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})\b'''
secretGroup = 1
label = "SECRET"
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]

[[rules.tests]]
input = "ghp_FAKEfakeFAKEfake0123456789abcdefGHIJ"
expect = ["ghp_FAKEfakeFAKEfake0123456789abcdefGHIJ"]
[[rules.tests]]
input = "ghp_FAKEfakeFAKEfake0123456789abcdefGHI"
expect = []

[[rules]]
id = "ai-key"
description = "Anthropic, OpenAI, Groq and xAI API keys"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])(sk-ant-[A-Za-z0-9_-]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{32,}|gsk_[A-Za-z0-9]{52,}|xai-[A-Za-z0-9]{80,})'''
secretGroup = 1
label = "SECRET"
keywords = ["sk-", "gsk_", "xai-"]

[[rules.tests]]
input = "sk-ant-api03-FakeFakeFakeFakeFake1234"
expect = ["sk-ant-api03-FakeFakeFakeFakeFake1234"]

[[rules]]
id = "aws-key"
description = "AWS access key IDs"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])((?:AKIA|ASIA)[0-9A-Z]{16})\b'''
secretGroup = 1
label = "SECRET"
keywords = ["akia", "asia"]

[[rules.tests]]
input = "AKIAFAKEFAKEFAKE1234"
expect = ["AKIAFAKEFAKEFAKE1234"]
[[rules.tests]]
input = "AKIAFAKEFAKEFAKE123"
expect = []

[[rules]]
id = "vendor-key"
description = "Slack and Google API keys, and Stripe secret, restricted and webhook keys (not the public pk_ key)"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])(xox[abprs]-[A-Za-z0-9-]{10,}|(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35})'''
secretGroup = 1
label = "SECRET"
keywords = ["xox", "_live_", "_test_", "whsec_", "aiza"]

[[rules.tests]]
input = "xoxb-1234567890-FakeFakeFake"
expect = ["xoxb-1234567890-FakeFakeFake"]

[[rules]]
id = "gitlab-token"
description = "GitLab personal access tokens, classic and routable"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])(glpat-[A-Za-z0-9_-]{20,}(?:\.[0-9a-z]{9}\b)?)'''
secretGroup = 1
label = "SECRET"
keywords = ["glpat-"]

[[rules.tests]]
input = "glpat-FakeFakeFake12345678"
expect = ["glpat-FakeFakeFake12345678"]

[[rules]]
id = "google-oauth-secret"
description = "A Google OAuth client secret (GOCSPX-)"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])(GOCSPX-[A-Za-z0-9_-]{28,})'''
secretGroup = 1
label = "SECRET"
keywords = ["gocspx-"]

[[rules.tests]]
input = "GOCSPX-FakeFakeFakeFakeFake12345678"
expect = ["GOCSPX-FakeFakeFakeFakeFake12345678"]

[[rules]]
id = "google-refresh-token"
description = "A Google OAuth refresh token (1//0)"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])(1//0[A-Za-z0-9_-]{40,})'''
secretGroup = 1
label = "SECRET"
keywords = ["1//0"]

[[rules.tests]]
input = "1//0gFakeFakeFakeFakeFakeFakeFakeFake12345678"
expect = ["1//0gFakeFakeFakeFakeFakeFakeFakeFake12345678"]

[[rules]]
id = "azure-storage-key"
description = "AccountKey= and SharedAccessKey= in Azure connection strings"
regex = '''(?i)(?:AccountKey|SharedAccessKey)=([A-Za-z0-9+/]{20,}={0,2})'''
secretGroup = 1
label = "SECRET"
keywords = ["accountkey", "sharedaccesskey"]

matrix = false
[[rules.tests]]
input = "DefaultEndpointsProtocol=https;AccountName=fabrikamq;AccountKey=RmFrZUtleUZha2VLZXlGYWtlS2V5RmFrZUtleQ==;EndpointSuffix=core.windows.net"
expect = ["RmFrZUtleUZha2VLZXlGYWtlS2V5RmFrZUtleQ=="]

[[rules]]
id = "azure-sas"
description = "The signature of an Azure SAS URL"
regex = '''[?&]sig=([A-Za-z0-9%+/]{20,})'''
secretGroup = 1
label = "SECRET"
keywords = ["sig="]

matrix = false
[[rules.tests]]
input = "https://fabrikamq.blob.core.windows.net/c/b.txt?sv=2022-11-02&sig=FakeSig%2BFakeSigFakeSig1234%3D"
expect = ["FakeSig%2BFakeSigFakeSig1234%3D"]

# Four characters before Q~ (three, then a digit), as in Betterleaks' rule.
# It may start with . ~ or -, so it starts at the start of the input, after
# any character outside its alphabet, after a literal \n \r or \t, or where
# \b matched before. It runs to the end of the token, so a longer token is
# hidden whole, not in part.
[[rules]]
id = "entra-client-secret"
description = "An Entra ID (Azure AD) app client secret"
regex = '''(?:^|\b|[^A-Za-z0-9_~.-]|\\[nrt])([A-Za-z0-9_~.-]{3}[0-9]Q~[A-Za-z0-9_~.-]{31,})'''
secretGroup = 1
label = "SECRET"
keywords = ["q~"]

[[rules.tests]]
input = "abc8Q~FakeFakeFakeFakeFakeFakeFake1234"
expect = ["abc8Q~FakeFakeFakeFakeFakeFakeFake1234"]

[[rules]]
id = "private-key"
description = "A PEM private key block"
regex = '''(?s)(-----BEGIN [A-Z ]{0,40}PRIVATE KEY(?: BLOCK)?-----.*?(?:-----END [A-Z ]{0,40}PRIVATE KEY(?: BLOCK)?-----|\z))'''
secretGroup = 1
label = "SECRET"
keywords = ["private key"]

matrix = false
[[rules.tests]]
input = "key:\n-----BEGIN PRIVATE KEY-----\nRmFrZUtleQ==\n-----END PRIVATE KEY-----\n"
expect = ["-----BEGIN PRIVATE KEY-----\nRmFrZUtleQ==\n-----END PRIVATE KEY-----"]

[[rules]]
id = "url-password"
description = "The password in scheme://user:password@host"
regex = '''(?:^|[^A-Za-z0-9_]|\\[nrt])[a-z][a-z0-9+.-]{1,20}://[^\s/:@]{0,80}:([^\s/@]{3,200})@'''
secretGroup = 1
label = "SECRET"
keywords = ["://"]

matrix = false
[[rules.tests]]
input = "postgres://app:FakePass123@db.example.test:5432/app"
expect = ["FakePass123"]

# --- By name: the field or variable says it holds a secret ------------------------

# Three forms of one rule, so a quoted value is hidden whole, spaces and all:
# "password": "two words", password: 'two words', and PASSWORD=bare.

[[rules]]
id = "named-secret-quoted"
description = "A double-quoted value of TOKEN, \"password\", client_secret and other names that say secret"
regex = '''(?im)(?:^|[\s"'{,;(])[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|authorization|_pat|\bpat)["']?\s*[:=]\s*"((?:[^"\\]|\\.){6,})"'''
secretGroup = 1
label = "SECRET"
# A reference, not a secret: $NAME, ${NAME}, $(cmd), <placeholder>, or a redact tag.
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|[*•]+$|\[(?i:redacted)\b[^\]]*\]$|(?i:token|bearer|basic|digest)\s+\S{1,5}$)'''
remember = "distinctive"
# A paging cursor, not a secret: continuationToken, next_token, nextPageToken, x-ms-continuationtoken.
exceptMatch = '''(?i)^[^A-Za-z0-9_.-]?[ \t-]*(?:name:[ \t]*["']?)?[A-Za-z0-9_.-]*(?:continuation|next|page)[_-]?token["']?\s*(?:[:=]|\n)'''
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "authorization", "pat"]

matrix = false
[[rules.tests]]
input = "{\"client_secret\": \"Zq8vFakeSecret42\"}"
expect = ["Zq8vFakeSecret42"]
[[rules.tests]]
input = "{\"nextPageToken\": \"abcdef123456\"}"
expect = []

[[rules]]
id = "named-secret-single-quoted"
description = "A single-quoted value of a name that says secret"
regex = '''(?im)(?:^|[\s"'{,;(])[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|authorization|_pat|\bpat)["']?\s*[:=]\s*'([^'\n][^'\n]{5,})\''''
secretGroup = 1
label = "SECRET"
# A reference, not a secret: $NAME, ${NAME}, $(cmd), <placeholder>, or a redact tag.
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|[*•]+$|\[(?i:redacted)\b[^\]]*\]$|(?i:token|bearer|basic|digest)\s+\S{1,5}$)'''
remember = "distinctive"
# A paging cursor, not a secret: continuationToken, next_token, nextPageToken, x-ms-continuationtoken.
exceptMatch = '''(?i)^[^A-Za-z0-9_.-]?[ \t-]*(?:name:[ \t]*["']?)?[A-Za-z0-9_.-]*(?:continuation|next|page)[_-]?token["']?\s*(?:[:=]|\n)'''
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "authorization", "pat"]

matrix = false
[[rules.tests]]
input = "password = 'Zq8vFakeSecret42'"
expect = ["Zq8vFakeSecret42"]

[[rules]]
id = "named-secret"
description = "An unquoted value of TOKEN=, password:, client_secret: and other names that say secret, to the end of the line (YAML values may hold spaces)"
regex = '''(?im)(?:^|[\s"'{,;(])[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|authorization|_pat|\bpat)["']?\s*[:=][ \t]*([^\s"',;}{=][^\n"',;]{5,}?)[ \t]*(?:$|[,;}{"'])'''
secretGroup = 1
label = "SECRET"
# A reference, not a secret: $NAME, ${NAME}, $(cmd), <placeholder>, or a redact tag.
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|[*•]+$|\[(?i:redacted)\b[^\]]*\]$|(?i:token|bearer|basic|digest)\s+\S{1,5}$)'''
remember = "distinctive"
# A paging cursor, not a secret: continuationToken, next_token, nextPageToken, x-ms-continuationtoken.
exceptMatch = '''(?i)^[^A-Za-z0-9_.-]?[ \t-]*(?:name:[ \t]*["']?)?[A-Za-z0-9_.-]*(?:continuation|next|page)[_-]?token["']?\s*(?:[:=]|\n)'''
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "authorization", "pat"]

matrix = false
[[rules.tests]]
input = "api_key=Zq8vFakeSecret42"
expect = ["Zq8vFakeSecret42"]
[[rules.tests]]
input = "token == null"
expect = []

# Only a name that says secret: TMPDIR, CONF_FILE or SSH_AUTH_SOCK stays visible.
# TOKEN, SECRET, PASSWORD and the other strong words count anywhere in the name
# (GITHUB_TOKEN_2); KEY, AUTH, PAT, COOKIE, SESSION and DSN only as its last part
# (SIGNING_KEY, not KEY_ID). A name ending _FILE, _PATH or _DIR holds a path.
# named-secret also matches a name that ends in a strong word, but stops at a
# comma or semicolon; this rule hides the value whole, to the end of the line.
[[rules]]
id = "env-dump"
description = "The value on a NAME=value line of env, mise env or a .env file, when the name says secret: TOKEN, SECRET, PASSWORD or CREDENTIAL anywhere in it, or a last part such as _KEY, _AUTH, _SESSION or _DSN"
regex = '''(?m)^(?:export\s+)?(?:[A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD|PASSWD|PASSPHRASE|PWD|APIKEY|CREDENTIAL|CONNSTR|CONNECTION_STRING|AUTHORIZATION)[A-Z0-9_]*|(?:[A-Z0-9_]*_)?(?:KEYS?|AUTH|PAT|COOKIES?|SESSION|DSN))=["'`]?([^\s"'`][^\n"'`]{5,})'''
secretGroup = 1
label = "ENV-VALUE"
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|[*•]+$|\[(?i:redacted)\b[^\]]*\]$|(?i:token|bearer|basic|digest)\s+\S{1,5}$)'''
remember = "distinctive"
# A path, or a paging cursor such as NEXT_PAGE_TOKEN, not a secret.
exceptMatch = '''^(?:export\s+)?[A-Z0-9_]*(?:_(?:FILE|PATH|DIR)|(?:NEXT|PAGE|CONTINUATION)_?TOKEN)='''
keywords = ["token", "secret", "pass", "pwd", "key", "credential", "connstr", "connection", "auth", "pat", "cookie", "session", "dsn"]

matrix = false
[[rules.tests]]
input = "SIGNING_KEY=Zq8vFakeKey;42"
expect = ["Zq8vFakeKey;42"]
[[rules.tests]]
input = "GITHUB_TOKEN_2=Zq8vFakeToken42"
expect = ["Zq8vFakeToken42"]
[[rules.tests]]
input = "TMPDIR=/var/folders/ab/T/"
expect = []
[[rules.tests]]
input = "KEY_FILE=/etc/app/tls/server.pem"
expect = []

# --- Second review: YAML forms and name/value pairs -------------------------------

[[rules]]
id = "named-secret-yaml"
description = "A YAML line `password: value`, to the end of the line, commas and quotes included"
regex = '''(?im)^[ \t-]*[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|_pat|\bpat)[ \t]*:[ \t]+([^\s|>"'#][^\n]{5,}?)[ \t]*$'''
secretGroup = 1
label = "SECRET"
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|[*•]+$|\[(?i:redacted)\b[^\]]*\]$|(?i:token|bearer|basic|digest)\s+\S{1,5}$)'''
remember = "distinctive"
# A paging cursor, not a secret: continuationToken, next_token, nextPageToken, x-ms-continuationtoken.
exceptMatch = '''(?i)^[^A-Za-z0-9_.-]?[ \t-]*(?:name:[ \t]*["']?)?[A-Za-z0-9_.-]*(?:continuation|next|page)[_-]?token["']?\s*(?:[:=]|\n)'''
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "pat"]

matrix = false
[[rules.tests]]
input = "db:\n  password: Zq8vFakeSecret42\n"
expect = ["Zq8vFakeSecret42"]
[[rules.tests]]
input = "pwd: 0"
expect = []

[[rules]]
id = "named-secret-yaml-block"
description = "A YAML block scalar under a name that says secret: `password: |` and the indented lines after it"
regex = '''(?im)^[ \t-]*[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|_pat|\bpat)[ \t]*:[ \t]*[|>][-+0-9]*[ \t]*\r?\n((?:[ \t]+[^\n]*(?:\n|\z))+)'''
secretGroup = 1
label = "SECRET"
# A paging cursor, not a secret: continuationToken, next_token, nextPageToken, x-ms-continuationtoken.
exceptMatch = '''(?i)^[^A-Za-z0-9_.-]?[ \t-]*(?:name:[ \t]*["']?)?[A-Za-z0-9_.-]*(?:continuation|next|page)[_-]?token["']?\s*(?:[:=]|\n)'''
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "pat"]

matrix = false
[[rules.tests]]
input = "private_key: |\n  line1fake\n  line2fake\n"
expect = ["  line1fake\n  line2fake"]

[[rules]]
id = "named-value"
description = "The value of a {\"name\": …, \"value\": …} pair whose name says secret: ACR passwords, Kubernetes env lists"
regex = '''(?i)"value"\s*:\s*"((?:[^"\\]|\\.)+)"'''
secretGroup = 1
label = "SECRET"
within = '''(?i)"name"\s*:\s*"[^"]*(?:password|passwd|secret|token|api[_-]?key|private[_-]?key|access[_-]?key|credential|pwd)[^"]*"'''
# A paging cursor's pair, not a secret: {"name": "continuationToken", "value": …}.
exceptMatch = '''(?i)"name"\s*:\s*"[A-Za-z0-9_.-]*(?:continuation|next|page)[_-]?token"'''
keywords = ["\"value\""]

matrix = false
[[rules.tests]]
input = "{\"name\": \"DB_PASSWORD\", \"value\": \"Zq8vFakeSecret42\"}"
expect = ["Zq8vFakeSecret42"]
[[rules.tests]]
input = "{\"name\": \"continuationToken\", \"value\": \"abc123def456\"}"
expect = []

# --- Third review: YAML name/value pairs and secrets passed as flags --------------

[[rules]]
id = "named-value-yaml"
description = "The value: line under a `- name:` line whose name says secret (kubectl ... -o yaml, app settings)"
regex = '''(?im)^[ \t-]*name:[ \t]*["']?[A-Za-z0-9_.-]*(?:password|passwd|secret|token|api[_-]?key|private[_-]?key|access[_-]?key|credential|pwd|connection[_-]?string)[A-Za-z0-9_.-]*["']?[ \t]*\r?\n[ \t]*value:[ \t]*["']?([^\n"']+?)["']?[ \t]*$'''
secretGroup = 1
label = "SECRET"
remember = "distinctive"
# A paging cursor, not a secret: continuationToken, next_token, nextPageToken, x-ms-continuationtoken.
exceptMatch = '''(?i)^[^A-Za-z0-9_.-]?[ \t-]*(?:name:[ \t]*["']?)?[A-Za-z0-9_.-]*(?:continuation|next|page)[_-]?token["']?\s*(?:[:=]|\n)'''
keywords = ["value:"]

matrix = false
[[rules.tests]]
input = "- name: DB_PASSWORD\n  value: Zq8vFakeSecret42\n"
expect = ["Zq8vFakeSecret42"]

[[rules]]
id = "secret-flag-quoted"
description = "A double-quoted command-line secret, including spaces and escaped quotes"
regex = '''(?i)(?:^|\s)--(?:password|passwd|pass|client-secret|secret|token|sas-token|api-key|access-key|secret-key|auth-token|account-key)(?:[ \t]+|=)"((?:[^"\\]|\\.){3,})"'''
secretGroup = 1
label = "SECRET"
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|[*•]+$|\[(?i:redacted)\b[^\]]*\]$|(?i:token|bearer|basic|digest)\s+\S{1,5}$|-)'''
remember = "distinctive"
keywords = ["--pass", "--client-secret", "--secret", "--token", "--sas-token", "--api-key", "--access-key", "--auth-token", "--account-key"]

matrix = false
[[rules.tests]]
input = "az login --password \"Zq8v Fake 42\""
expect = ["Zq8v Fake 42"]

[[rules]]
id = "secret-flag-single-quoted"
description = "A single-quoted command-line secret, including spaces"
regex = '''(?i)(?:^|\s)--(?:password|passwd|pass|client-secret|secret|token|sas-token|api-key|access-key|secret-key|auth-token|account-key)(?:[ \t]+|=)'([^']{3,})\''''
secretGroup = 1
label = "SECRET"
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|[*•]+$|\[(?i:redacted)\b[^\]]*\]$|(?i:token|bearer|basic|digest)\s+\S{1,5}$|-)'''
remember = "distinctive"
keywords = ["--pass", "--client-secret", "--secret", "--token", "--sas-token", "--api-key", "--access-key", "--auth-token", "--account-key"]

matrix = false
[[rules.tests]]
input = "tool --token 'Zq8vFake42'"
expect = ["Zq8vFake42"]

[[rules]]
id = "secret-flag"
description = "The value of --password, --client-secret, --token and similar command-line flags"
regex = '''(?i)(?:^|\s)--(?:password|passwd|pass|client-secret|secret|token|sas-token|api-key|access-key|secret-key|auth-token|account-key)(?:[ \t]+|=)["']?([^\s"']{3,})'''
secretGroup = 1
label = "SECRET"
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|[*•]+$|\[(?i:redacted)\b[^\]]*\]$|(?i:token|bearer|basic|digest)\s+\S{1,5}$|-)'''
remember = "distinctive"
keywords = ["--pass", "--client-secret", "--secret", "--token", "--sas-token", "--api-key", "--access-key", "--auth-token", "--account-key"]

matrix = false
[[rules.tests]]
input = "tool --client-secret=Zq8vFake42"
expect = ["Zq8vFake42"]

[[rules]]
id = "docker-login-password"
description = "The password after -p in docker login (and podman login)"
regex = '''(?i)\b(?:docker|podman)\s+login\b[^\n]*?\s-p[ \t]+([^\s]+)'''
secretGroup = 1
label = "SECRET"
remember = "distinctive"
keywords = ["login"]

matrix = false
[[rules.tests]]
input = "docker login -u app -p Zq8vFake42 registry.example.test"
expect = ["Zq8vFake42"]

[[rules]]
id = "mysql-password"
description = "The password joined to -p in mysql, mysqldump and mysqladmin (-pSECRET)"
regex = '''(?i)\bmysql(?:dump|admin)?\b[^\n]*?\s-p([^\s-][^\s]*)'''
secretGroup = 1
label = "SECRET"
remember = "distinctive"
keywords = ["mysql"]

matrix = false
[[rules.tests]]
input = "mysql -u root -pZq8vFake42 app"
expect = ["Zq8vFake42"]

# --- Last: a random-looking token with no known prefix ----------------------------

# A run of 24+ letters and digits, mixing lower case, upper case and digits, above
# 3.6 bits of entropy per character (transcript-redactor's defaults). The run is
# taken whole across + / = _ ~ - so base64, paths and snake_case or kebab-case
# names are left alone, not cut into pieces. Wrapped base64 (a PEM certificate, at
# 64 or 76 characters a line, indented or not) is skipped with its short last line:
# the first two branches match it without the group, so nothing is hidden. Nothing
# starts right after a backslash, so a JSON `\n` escape is never taken into a token.
[[rules]]
id = "random-token"
description = "A long random-looking token with no known prefix: 24+ letters and digits, mixed case, above 3.6 bits of entropy per character"
regex = '''(?m)^[ \t]*[A-Za-z0-9+/]{64}\r?(?:\n[ \t]*[A-Za-z0-9+/]{64}\r?)*(?:\n[ \t]*[A-Za-z0-9+/]+={0,2}\r?)?$|^[ \t]*[A-Za-z0-9+/]{76}\r?(?:\n[ \t]*[A-Za-z0-9+/]{76}\r?)*(?:\n[ \t]*[A-Za-z0-9+/]+={0,2}\r?)?$|(?:^|[^A-Za-z0-9+/=_~\\\n-])([A-Za-z0-9+/=_~-]{24,})'''
secretGroup = 1
label = "SECRET"
entropy = 3.6
# Not a token: a camelCase name, such as cacheCreationEphemeral5mInputTokens.
check = "not-a-name"
# Not a token either: a run with a symbol in it, or one missing a lower-case letter,
# a capital or a digit (git SHAs, UUID parts).
except = '''[^A-Za-z0-9]|^[^a-z]*$|^[^A-Z]*$|^[^0-9]*$'''

[[rules.tests]]
input = "Zq8vR2mK9xLp4TfW7bNc3HsJ"
expect = ["Zq8vR2mK9xLp4TfW7bNc3HsJ"]
[[rules.tests]]
input = "cacheCreationEphemeral5mInputTokens"
expect = []
