# Built-in pack: credentials, wherever they appear.
# Two kinds of rule: a vendor's own key shape (found on sight), and a value whose
# name says it is a secret (TOKEN=, "password":, Authorization:). Values in an
# environment dump (`env`, `mise env`, `cat .env`) are hidden too.
#
# Several vendor shapes (the Entra client secret, Azure SAS and storage keys among
# them) follow the patterns in Ray Amjad's transcript-redactor
# (github.com/ray-amjad/claude-code-mods, MIT licence), rewritten for Rust's regex.
# The Groq, xAI and Google OAuth key lengths follow redact-transcripts' scrub rules
# (Apache-2.0); GitLab's and Stripe's follow gitleaks' rules.
schema_version = 1
id = "credentials"
description = "Tokens, keys and passwords: JWTs, bearer tokens, common vendor key shapes, private key blocks, passwords in URLs, values named as secrets, and environment dump values"

# Exact values left alone even when a rule below matches them: settings, not
# secrets. `NODE_ENV=development` keeps `development`; `"tokenType": "Bearer"`
# keeps the word `Bearer`. The token after `Bearer` in a header is still hidden.
allow = ["true", "false", "development", "production", "staging", "localhost", "debug", "info", "warning", "error", "Bearer"]

# --- On sight: the shape alone says what it is -----------------------------------

[[rules]]
id = "jwt"
description = "A JSON Web Token (header.payload.signature), e.g. an Azure access token"
regex = '''\b(eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})'''
secretGroup = 1
label = "JWT"
keywords = ["eyj"]

[[rules]]
id = "bearer"
description = "The token after Bearer in an Authorization header"
regex = '''(?i)\bbearer\s+([A-Za-z0-9._~+/=-]{16,})'''
secretGroup = 1
label = "TOKEN"
keywords = ["bearer"]

[[rules]]
id = "github-token"
description = "GitHub personal, OAuth, app and fine-grained tokens"
regex = '''\b((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})\b'''
secretGroup = 1
label = "TOKEN"
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]

[[rules]]
id = "ai-key"
description = "Anthropic, OpenAI, Groq and xAI API keys"
regex = '''\b(sk-ant-[A-Za-z0-9_-]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{32,}|gsk_[A-Za-z0-9]{52,}|xai-[A-Za-z0-9]{80,})'''
secretGroup = 1
label = "API-KEY"
keywords = ["sk-", "gsk_", "xai-"]

[[rules]]
id = "aws-key"
description = "AWS access key IDs"
regex = '''\b((?:AKIA|ASIA)[0-9A-Z]{16})\b'''
secretGroup = 1
label = "API-KEY"
keywords = ["akia", "asia"]

[[rules]]
id = "vendor-key"
description = "Slack and Google API keys, and Stripe secret, restricted and webhook keys (not the public pk_ key)"
regex = '''\b(xox[abprs]-[A-Za-z0-9-]{10,}|(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35})'''
secretGroup = 1
label = "API-KEY"
keywords = ["xox", "_live_", "_test_", "whsec_", "aiza"]

[[rules]]
id = "gitlab-token"
description = "GitLab personal access tokens, classic and routable"
regex = '''\b(glpat-[A-Za-z0-9_-]{20,}(?:\.[0-9a-z]{9}\b)?)'''
secretGroup = 1
label = "TOKEN"
keywords = ["glpat-"]

[[rules]]
id = "google-oauth-secret"
description = "A Google OAuth client secret (GOCSPX-)"
regex = '''\b(GOCSPX-[A-Za-z0-9_-]{28,})'''
secretGroup = 1
label = "CLIENT-SECRET"
keywords = ["gocspx-"]

[[rules]]
id = "google-refresh-token"
description = "A Google OAuth refresh token (1//0)"
regex = '''\b(1//0[A-Za-z0-9_-]{40,})'''
secretGroup = 1
label = "TOKEN"
keywords = ["1//0"]

[[rules]]
id = "azure-storage-key"
description = "AccountKey= and SharedAccessKey= in Azure connection strings"
regex = '''(?i)(?:AccountKey|SharedAccessKey)=([A-Za-z0-9+/]{20,}={0,2})'''
secretGroup = 1
label = "STORAGE-KEY"
keywords = ["accountkey", "sharedaccesskey"]

[[rules]]
id = "azure-sas"
description = "The signature of an Azure SAS URL"
regex = '''[?&]sig=([A-Za-z0-9%+/]{20,})'''
secretGroup = 1
label = "SAS-SIG"
keywords = ["sig="]

[[rules]]
id = "entra-client-secret"
description = "An Entra ID (Azure AD) app client secret"
regex = '''\b([A-Za-z0-9_~.-]{3}[0-9][A-Za-z0-9_~.-]Q~[A-Za-z0-9_~.-]{31,34})'''
secretGroup = 1
label = "CLIENT-SECRET"
keywords = ["q~"]

[[rules]]
id = "private-key"
description = "A PEM private key block"
regex = '''(?s)(-----BEGIN [A-Z ]{0,40}PRIVATE KEY(?: BLOCK)?-----.*?(?:-----END [A-Z ]{0,40}PRIVATE KEY(?: BLOCK)?-----|\z))'''
secretGroup = 1
label = "PRIVATE-KEY"
keywords = ["private key"]

[[rules]]
id = "url-password"
description = "The password in scheme://user:password@host"
regex = '''\b[a-z][a-z0-9+.-]{1,20}://[^\s/:@]{0,80}:([^\s/@]{3,200})@'''
secretGroup = 1
label = "PASSWORD"
keywords = ["://"]

# --- By name: the field or variable says it holds a secret ------------------------

# Three forms of one rule, so a quoted value is hidden whole, spaces and all:
# "password": "two words", password: 'two words', and PASSWORD=bare.

[[rules]]
id = "named-secret-quoted"
description = "A double-quoted value of TOKEN, \"password\", client_secret and other names that say secret"
regex = '''(?im)(?:^|[\s"'{,;(])[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|authorization|_pat|\bpat)["']?\s*[:=]\s*"((?:[^"\\]|\\.){6,})"'''
secretGroup = 1
label = "SECRET"
# A reference, not a secret: $NAME, ${NAME}, $(cmd), <placeholder>, or a redact tag.
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$)'''
remember = "distinctive"
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "authorization", "pat"]

[[rules]]
id = "named-secret-single-quoted"
description = "A single-quoted value of a name that says secret"
regex = '''(?im)(?:^|[\s"'{,;(])[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|authorization|_pat|\bpat)["']?\s*[:=]\s*'([^'\n][^'\n]{5,})\''''
secretGroup = 1
label = "SECRET"
# A reference, not a secret: $NAME, ${NAME}, $(cmd), <placeholder>, or a redact tag.
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$)'''
remember = "distinctive"
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "authorization", "pat"]

[[rules]]
id = "named-secret"
description = "An unquoted value of TOKEN=, password:, client_secret: and other names that say secret, to the end of the line (YAML values may hold spaces)"
regex = '''(?im)(?:^|[\s"'{,;(])[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|authorization|_pat|\bpat)["']?\s*[:=][ \t]*([^\s"',;}{][^\n"',;]{5,}?)[ \t]*(?:$|[,;}{"'])'''
secretGroup = 1
label = "SECRET"
# A reference, not a secret: $NAME, ${NAME}, $(cmd), <placeholder>, or a redact tag.
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$)'''
remember = "distinctive"
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "authorization", "pat"]

[[rules]]
id = "env-dump"
description = "The value on each NAME=value line of env, mise env or a .env file"
regex = '''(?m)^(?:export\s+)?[A-Z][A-Z0-9_]{2,}=["'`]?([^\s"'`][^\n"'`]{5,})'''
secretGroup = 1
label = "ENV-VALUE"
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$)'''
remember = "distinctive"

# --- Second review: YAML forms and name/value pairs -------------------------------

[[rules]]
id = "named-secret-yaml"
description = "A YAML line `password: value`, to the end of the line, commas and quotes included"
regex = '''(?im)^[ \t-]*[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|_pat|\bpat)[ \t]*:[ \t]+([^\s|>"'#][^\n]*?)[ \t]*$'''
secretGroup = 1
label = "SECRET"
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$)'''
remember = "distinctive"
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "pat"]

[[rules]]
id = "named-secret-yaml-block"
description = "A YAML block scalar under a name that says secret: `password: |` and the indented lines after it"
regex = '''(?im)^[ \t-]*[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|_pat|\bpat)[ \t]*:[ \t]*[|>][-+0-9]*[ \t]*\r?\n((?:[ \t]+[^\n]*(?:\n|\z))+)'''
secretGroup = 1
label = "SECRET"
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "pat"]

[[rules]]
id = "named-value"
description = "The value of a {\"name\": …, \"value\": …} pair whose name says secret: ACR passwords, Kubernetes env lists"
regex = '''(?i)"value"\s*:\s*"((?:[^"\\]|\\.)+)"'''
secretGroup = 1
label = "SECRET"
within = '''(?i)"name"\s*:\s*"[^"]*(?:password|passwd|secret|token|api[_-]?key|private[_-]?key|access[_-]?key|credential|pwd)[^"]*"'''
keywords = ["\"value\""]

# --- Third review: YAML name/value pairs and secrets passed as flags --------------

[[rules]]
id = "named-value-yaml"
description = "The value: line under a `- name:` line whose name says secret (kubectl ... -o yaml, app settings)"
regex = '''(?im)^[ \t-]*name:[ \t]*["']?[A-Za-z0-9_.-]*(?:password|passwd|secret|token|api[_-]?key|private[_-]?key|access[_-]?key|credential|pwd|connection[_-]?string)[A-Za-z0-9_.-]*["']?[ \t]*\r?\n[ \t]*value:[ \t]*["']?([^\n"']+?)["']?[ \t]*$'''
secretGroup = 1
label = "SECRET"
remember = "distinctive"
keywords = ["value:"]

[[rules]]
id = "secret-flag"
description = "The value of --password, --client-secret, --token and similar command-line flags"
regex = '''(?i)(?:^|\s)--(?:password|passwd|pass|client-secret|secret|token|sas-token|api-key|access-key|secret-key|auth-token|account-key)(?:[ \t]+|=)["']?([^\s"']{3,})'''
secretGroup = 1
label = "SECRET"
except = '''^(?:\$\{[A-Za-z_][A-Za-z0-9_]*\}?$|\$\([^)]*\)$|\$[A-Z_][A-Z0-9_]*$|<[^<>]*>$|\[[A-Z][A-Z0-9-]*-[0-9a-f]{8}\]$|-)'''
remember = "distinctive"
keywords = ["--pass", "--client-secret", "--secret", "--token", "--sas-token", "--api-key", "--access-key", "--auth-token", "--account-key"]

[[rules]]
id = "docker-login-password"
description = "The password after -p in docker login (and podman login)"
regex = '''(?i)\b(?:docker|podman)\s+login\b[^\n]*?\s-p[ \t]+([^\s]+)'''
secretGroup = 1
label = "SECRET"
remember = "distinctive"
keywords = ["login"]

[[rules]]
id = "mysql-password"
description = "The password joined to -p in mysql, mysqldump and mysqladmin (-pSECRET)"
regex = '''(?i)\bmysql(?:dump|admin)?\b[^\n]*?\s-p([^\s-][^\s]*)'''
secretGroup = 1
label = "SECRET"
remember = "distinctive"
keywords = ["mysql"]

# --- Last: a random-looking token with no known prefix ----------------------------

# A run of 24+ letters and digits, mixing lower case, upper case and digits, above
# 3.6 bits of entropy per character (transcript-redactor's defaults). The run is
# taken whole across + / = _ ~ - so base64, paths and snake_case or kebab-case
# names are left alone, not cut into pieces. Wrapped base64 (a PEM certificate, at
# 64 or 76 characters a line, indented or not) is skipped with its short last line:
# the first two branches match it without the group, so nothing is hidden. Nothing
# starts right after a backslash, so a JSON `\n` escape is never taken into a token.
[[rules]]
id = "random-token"
description = "A long random-looking token with no known prefix: 24+ letters and digits, mixed case, above 3.6 bits of entropy per character"
regex = '''(?m)^[ \t]*[A-Za-z0-9+/]{64}\r?(?:\n[ \t]*[A-Za-z0-9+/]{64}\r?)*(?:\n[ \t]*[A-Za-z0-9+/]+={0,2}\r?)?$|^[ \t]*[A-Za-z0-9+/]{76}\r?(?:\n[ \t]*[A-Za-z0-9+/]{76}\r?)*(?:\n[ \t]*[A-Za-z0-9+/]+={0,2}\r?)?$|(?:^|[^A-Za-z0-9+/=_~\\\n-])([A-Za-z0-9+/=_~-]{24,})'''
secretGroup = 1
label = "SECRET"
entropy = 3.6
# Not a token: a camelCase name, such as cacheCreationEphemeral5mInputTokens.
check = "not-a-name"
# Not a token either: a run with a symbol in it, or one missing a lower-case letter,
# a capital or a digit (git SHAs, UUID parts).
except = '''[^A-Za-z0-9]|^[^a-z]*$|^[^A-Z]*$|^[^0-9]*$'''
