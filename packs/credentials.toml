# Built-in pack: credentials, wherever they appear.
# Two kinds of rule: a vendor's own key shape (found on sight), and a value whose
# name says it is a secret (TOKEN=, "password":, Authorization:). Values in an
# environment dump (`env`, `mise env`, `cat .env`) are hidden too.
#
# Several vendor shapes (the Entra client secret, Azure SAS and storage keys among
# them) follow the patterns in Ray Amjad's transcript-redactor
# (github.com/ray-amjad/claude-code-mods, MIT licence), rewritten for Rust's regex.
schema_version = 1
id = "credentials"
description = "Tokens, keys and passwords: JWTs, bearer tokens, common vendor key shapes, private key blocks, passwords in URLs, values named as secrets, and environment dump values"

# Settings, not secrets: never hidden by the rules below.
allow = ["true", "false", "development", "production", "staging", "localhost", "debug", "info", "warning", "error", "Bearer"]

# --- On sight: the shape alone says what it is -----------------------------------

[[rules]]
id = "jwt"
description = "A JSON Web Token (header.payload.signature), e.g. an Azure access token"
regex = '''\b(eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,})'''
secretGroup = 1
label = "JWT"
keywords = ["eyj"]

[[rules]]
id = "bearer"
description = "The token after Bearer in an Authorization header"
regex = '''(?i)\bbearer\s+([A-Za-z0-9._~+/=-]{16,})'''
secretGroup = 1
label = "TOKEN"
keywords = ["bearer"]

[[rules]]
id = "github-token"
description = "GitHub personal, OAuth, app and fine-grained tokens"
regex = '''\b((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,})\b'''
secretGroup = 1
label = "TOKEN"
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]

[[rules]]
id = "ai-key"
description = "Anthropic and OpenAI API keys"
regex = '''\b(sk-ant-[A-Za-z0-9_-]{20,}|sk-(?:proj-)?[A-Za-z0-9_-]{32,})'''
secretGroup = 1
label = "API-KEY"
keywords = ["sk-"]

[[rules]]
id = "aws-key"
description = "AWS access key IDs"
regex = '''\b((?:AKIA|ASIA)[0-9A-Z]{16})\b'''
secretGroup = 1
label = "API-KEY"
keywords = ["akia", "asia"]

[[rules]]
id = "vendor-key"
description = "Slack, Stripe and Google API keys"
regex = '''\b(xox[abprs]-[A-Za-z0-9-]{10,}|(?:sk|rk)_live_[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{35})'''
secretGroup = 1
label = "API-KEY"
keywords = ["xox", "_live_", "aiza"]

[[rules]]
id = "azure-storage-key"
description = "AccountKey= and SharedAccessKey= in Azure connection strings"
regex = '''(?i)(?:AccountKey|SharedAccessKey)=([A-Za-z0-9+/]{20,}={0,2})'''
secretGroup = 1
label = "STORAGE-KEY"
keywords = ["accountkey", "sharedaccesskey"]

[[rules]]
id = "azure-sas"
description = "The signature of an Azure SAS URL"
regex = '''[?&]sig=([A-Za-z0-9%+/]{20,})'''
secretGroup = 1
label = "SAS-SIG"
keywords = ["sig="]

[[rules]]
id = "entra-client-secret"
description = "An Entra ID (Azure AD) app client secret"
regex = '''\b([A-Za-z0-9_~.-]{3}[0-9][A-Za-z0-9_~.-]Q~[A-Za-z0-9_~.-]{31,34})'''
secretGroup = 1
label = "CLIENT-SECRET"
keywords = ["q~"]

[[rules]]
id = "private-key"
description = "A PEM private key block"
regex = '''(?s)(-----BEGIN [A-Z ]{0,40}PRIVATE KEY-----.*?-----END [A-Z ]{0,40}PRIVATE KEY-----)'''
secretGroup = 1
label = "PRIVATE-KEY"
keywords = ["private key"]

[[rules]]
id = "url-password"
description = "The password in scheme://user:password@host"
regex = '''\b[a-z][a-z0-9+.-]{1,20}://[^\s/:@]{0,80}:([^\s/@]{3,200})@'''
secretGroup = 1
label = "PASSWORD"
keywords = ["://"]

# --- By name: the field or variable says it holds a secret ------------------------

[[rules]]
id = "named-secret"
description = "The value of TOKEN=, \"password\":, client_secret: and other names that say secret"
regex = '''(?im)(?:^|[\s"'{,;(])[A-Za-z0-9_.-]*(?:token|secret|passwd|password|pwd|api[_-]?key|apikey|private[_-]?key|access[_-]?key|client[_-]?secret|connection[_-]?string|connstr|authorization|_pat|\bpat)["']?\s*[:=]\s*["']?([^\s"',;}{$<\[][^\s"',;}{]{5,})'''
secretGroup = 1
label = "SECRET"
remember = "distinctive"
keywords = ["token", "secret", "passw", "pwd", "key", "connection", "connstr", "authorization", "pat"]

[[rules]]
id = "env-dump"
description = "The value on each NAME=value line of env, mise env or a .env file"
regex = '''(?m)^(?:export\s+)?[A-Z][A-Z0-9_]{2,}=["']?([^\s"'$][^\n"']{5,})'''
secretGroup = 1
label = "ENV-VALUE"
remember = "distinctive"
