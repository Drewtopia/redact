# Built-in pack: Azure and Azure DevOps.
# Each rule's regex finds a spot; `secretGroup` is the capture group that gets hidden,
# and `label` is what the placeholder says instead: [TENANT-ID-1a2b3c4d].
# `remember = "distinctive"` hides that value everywhere else in the same text when it
# reads as a name; `"any"` does so for any capitalised or 5+ character value.
schema_version = 1
id = "azure"
description = "Azure tenant, subscription and identity IDs; people in Azure DevOps and Microsoft Graph records; your own Azure hosts; Azure DevOps org, project and repo names; az account details; and pipeline variable values"
keywords = ["tenant", "subscription", "client", "app", "object", "principal", "identities", "isdefault", "uniquename", "principalname", "system.", "microsoft.vsts.", "dynamics.com", "azurewebsites", "powerappsportals", "vault.azure", "windows.net", "azurecr", "sharepoint", "onmicrosoft", "dev.azure.com", "/_git/", "wellformed", "remoteurl", "sshurl", "user", "mail", "userprincipalname", "companyname", "phone", "lastaccesseddate", "microsoftonline", "sts.windows", "application", "visualstudio", "/secrets/", "keyname", "masterkey", "primarykey", "secondarykey", "mailaddress", "issecret", "\"value\"", "directoryalias", "ssh.dev.azure.com"]

# Public values Microsoft documents: never hidden.
allow = [
  "AzureCloud",
  "04b07795-8ddb-461a-bbee-02f9e1bf7b46", # Azure CLI app ID
  "1950a258-227b-4e31-a9cf-717495945fc2", # Azure PowerShell app ID
  "00000003-0000-0000-c000-000000000000", # Microsoft Graph app ID
  "797f4846-ba00-4fd7-ba43-dac1f8f63013", # Azure Resource Manager app ID
  "8e3af657-a8ff-443c-a75c-2fe8c4bcb635", # Owner role
  "b24988ac-6180-42a0-ab88-20f7382dd24c", # Contributor role
  "acdd72a7-3385-48ef-bd42-f606fba81ae7", # Reader role
]

# --- IDs beside the name that says what they are ------------------------------

[[rules]]
id = "tenant-id"
description = "A tenant GUID after tenantId, /tenants/ or --tenant"
regex = '''(?i)(?:tenant(?:[_-]?id)?["']?[ \t]*[:=][ \t]*["']?|/tenants/|login\.microsoftonline\.com/|sts\.windows\.net/|--tenant[ \t=]+["']?)([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
label = "TENANT-ID"
keywords = ["tenant", "microsoftonline", "sts.windows"]

matrix = false
[[rules.tests]]
input = "{\"tenantId\": \"00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c\"}"
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]

[[rules]]
id = "subscription-id"
description = "A subscription GUID after subscriptionId, /subscriptions/ or --subscription"
regex = '''(?i)(?:subscription(?:[_-]?id)?["']?[ \t]*[:=][ \t]*["']?|/subscriptions/|--subscription[ \t=]+["']?)([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
label = "SUBSCRIPTION-ID"
keywords = ["subscription"]

matrix = false
[[rules.tests]]
input = "/subscriptions/00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c/resourceGroups/rg"
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]

[[rules]]
id = "subscription-record-id"
description = "The bare \"id\" in an az account record"
regex = '''(?i)"id"\s*:\s*"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"'''
secretGroup = 1
label = "SUBSCRIPTION-ID"
within = '''(?i)"isDefault"\s*:'''
keywords = ["isdefault"]

matrix = false
[[rules.tests]]
input = "{\"id\": \"00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c\", \"isDefault\": true}"
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]

[[rules]]
id = "app-id"
description = "An app or client GUID after appId or clientId"
regex = '''(?i)(?:client|app|application)[_-]?id["']?[ \t]*[:=][ \t]*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
label = "APP-ID"
keywords = ["client", "app"]

matrix = false
[[rules.tests]]
input = "{\"appId\": \"00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c\"}"
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]
[[rules.tests]]
input = "{\"appId\": \"04b07795-8ddb-461a-bbee-02f9e1bf7b46\"}"
expect = []

[[rules]]
id = "object-id"
description = "An object or principal GUID after objectId or principalId"
regex = '''(?i)(?:object|principal)[_-]?id["']?[ \t]*[:=][ \t]*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
label = "OBJECT-ID"
keywords = ["object", "principal"]

matrix = false
[[rules.tests]]
input = "\"principalId\": \"00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c\""
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]

[[rules]]
id = "identity-id"
description = "An Azure DevOps identity GUID in an identity URL"
regex = '''(?i)/_apis/identities/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
label = "IDENTITY-ID"
keywords = ["identities"]

matrix = false
[[rules.tests]]
input = "https://vssps.dev.azure.com/fabrikamq/_apis/identities/00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]

# --- People --------------------------------------------------------------------

[[rules]]
id = "identity-person"
description = "A name in an Azure DevOps or Entra identity record"
regex = '''(?i)"(?:displayName|givenName|surname)"\s*:\s*"((?:[^"\\]|\\.){2,})"'''
secretGroup = 1
label = "PERSON"
within = '''(?i)"(?:uniqueName|userPrincipalName|principalName|mailAddress)"\s*:'''
remember = "distinctive"
keywords = ["uniquename", "principalname"]

matrix = false
[[rules.tests]]
input = "{\"displayName\": \"Jordan Quillfake\", \"uniqueName\": \"jordan.fake@fabrikamq.example\"}"
expect = ["Jordan Quillfake"]

[[rules]]
id = "work-item-person"
description = "The flat form: \"System.AssignedTo\": \"Name <email>\""
regex = '''(?i)"(?:System|Microsoft\.VSTS\.[A-Za-z]+)\.(?:AssignedTo|CreatedBy|ChangedBy|AuthorizedAs|ActivatedBy|ResolvedBy|ClosedBy)"\s*:\s*"([^"<\\]{2,200}?)\s*(?:<[^"]*)?"'''
secretGroup = 1
label = "PERSON"
remember = "distinctive"
keywords = ["system.", "microsoft.vsts."]

matrix = false
[[rules.tests]]
input = "{\"System.AssignedTo\": \"Jordan Quillfake <jordan.fake@fabrikamq.example>\"}"
expect = ["Jordan Quillfake"]

# --- Your own hosts: the <name> part is yours, the suffix is Microsoft's ---------

[[rules]]
id = "dataverse-env"
description = "<name>.crm11.dynamics.com"
regex = '''(?i)(?:^|[^a-z0-9-])([a-z0-9][a-z0-9-]{1,62})\.crm[0-9]*\.dynamics\.com'''
secretGroup = 1
label = "DATAVERSE-ENV"
remember = "distinctive"
keywords = ["dynamics.com"]

matrix = false
[[rules.tests]]
input = "https://fabrikamq-dev.crm4.dynamics.com/api"
expect = ["fabrikamq-dev"]

[[rules]]
id = "web-app"
description = "<name>.azurewebsites.net and <name>.powerappsportals.com"
regex = '''(?i)(?:^|[^a-z0-9-])([a-z0-9][a-z0-9-]{1,62})\.(?:(?:scm\.)?azurewebsites\.net|powerappsportals\.com)'''
secretGroup = 1
label = "WEB-APP"
remember = "distinctive"
keywords = ["azurewebsites", "powerappsportals"]

matrix = false
[[rules.tests]]
input = "https://fabrikamq-api.azurewebsites.net"
expect = ["fabrikamq-api"]

[[rules]]
id = "azure-resource"
description = "Key Vault, storage, SQL, Service Bus and container registry names"
regex = '''(?i)(?:^|[^a-z0-9-])([a-z0-9][a-z0-9-]{1,62})\.(?:vault\.azure\.net|(?:blob|file|queue|table|dfs)\.core\.windows\.net|database\.windows\.net|servicebus\.windows\.net|azurecr\.io)'''
secretGroup = 1
label = "AZURE-RESOURCE"
remember = "distinctive"
keywords = ["vault.azure", "windows.net", "azurecr"]

matrix = false
[[rules.tests]]
input = "https://fabrikamq-kv.vault.azure.net/secrets/x"
expect = ["fabrikamq-kv"]

[[rules]]
id = "tenant-name"
description = "<name>.sharepoint.com and <name>.onmicrosoft.com"
regex = '''(?i)(?:^|[^a-z0-9-])([a-z0-9][a-z0-9-]{1,62})\.(?:sharepoint\.com|onmicrosoft\.com)'''
secretGroup = 1
label = "TENANT-NAME"
remember = "any"
keywords = ["sharepoint", "onmicrosoft"]

matrix = false
[[rules.tests]]
input = "https://fabrikamq.sharepoint.com/sites/x"
expect = ["fabrikamq"]

# --- Azure DevOps: found by place, not listed ------------------------------------

[[rules]]
id = "ado-org"
description = "dev.azure.com/<org>"
regex = '''(?i)dev\.azure\.com/([a-z0-9][a-z0-9-]{0,49})\b'''
secretGroup = 1
label = "ORG"
remember = "any"
keywords = ["dev.azure.com"]

matrix = false
[[rules.tests]]
input = "https://dev.azure.com/fabrikamq/"
expect = ["fabrikamq"]

[[rules]]
id = "ado-project-url"
description = "dev.azure.com/<org>/<project>"
regex = '''(?i)dev\.azure\.com/[^/\s"']{1,60}/([^/\s"'?#_][^/\s"'?#]{0,63})'''
secretGroup = 1
label = "PROJECT"
remember = "any"
keywords = ["dev.azure.com"]

matrix = false
[[rules.tests]]
input = "https://dev.azure.com/fabrikamq/Northwind%20App/_git/repo"
expect = ["Northwind%20App"]

[[rules]]
id = "ado-repo-url"
description = ".../_git/<repo>"
regex = '''/_git/([^/\s"'?#]{1,64})'''
secretGroup = 1
label = "REPO"
remember = "distinctive"
keywords = ["/_git/"]

matrix = false
[[rules.tests]]
input = "https://dev.azure.com/fabrikamq/Proj/_git/northwind-api"
expect = ["northwind-api"]

[[rules]]
id = "work-item-project"
description = "A work item's TeamProject, and the first part of AreaPath and IterationPath"
regex = '''(?i)"System\.(?:TeamProject|AreaPath|IterationPath|AreaLevel1|IterationLevel1)"\s*:\s*"([^"\\]{1,64})'''
secretGroup = 1
label = "PROJECT"
remember = "any"
keywords = ["system."]

matrix = false
[[rules.tests]]
input = "{\"System.TeamProject\": \"Northwind App\"}"
expect = ["Northwind App"]

[[rules]]
id = "project-record"
description = "The name in an az devops project record"
regex = '''(?i)"name"\s*:\s*"((?:[^"\\]|\\.){1,})"'''
secretGroup = 1
label = "PROJECT"
within = '''(?i)"state"\s*:\s*"wellFormed"'''
remember = "any"
keywords = ["wellformed"]

matrix = false
[[rules.tests]]
input = "{\"name\": \"Northwind App\", \"state\": \"wellFormed\"}"
expect = ["Northwind App"]

[[rules]]
id = "repo-record"
description = "The name in an az repos record"
regex = '''(?i)"name"\s*:\s*"((?:[^"\\]|\\.){1,})"'''
secretGroup = 1
label = "REPO"
within = '''(?i)"(?:remoteUrl|sshUrl)"\s*:'''
remember = "distinctive"
keywords = ["remoteurl", "sshurl"]

matrix = false
[[rules.tests]]
input = "{\"name\": \"northwind-api\", \"remoteUrl\": \"https://example.test/r\"}"
expect = ["northwind-api"]

# --- az account show / list ------------------------------------------------------

[[rules]]
id = "tenant-display-name"
description = "tenantDisplayName: usually the organisation's own name"
regex = '''(?i)"tenantDisplayName"\s*:\s*"((?:[^"\\]|\\.){1,})"'''
secretGroup = 1
label = "TENANT-NAME"
remember = "any"
keywords = ["tenantdisplayname"]

matrix = false
[[rules.tests]]
input = "{\"tenantDisplayName\": \"Fabrikam Q Ltd\"}"
expect = ["Fabrikam Q Ltd"]

[[rules]]
id = "subscription-name"
description = "The name of a subscription in an az account record"
regex = '''(?i)"name"\s*:\s*"((?:[^"\\]|\\.){1,})"'''
secretGroup = 1
label = "SUBSCRIPTION-NAME"
within = '''(?i)"isDefault"\s*:'''
remember = "distinctive"
keywords = ["isdefault"]

matrix = false
[[rules.tests]]
input = "{\"name\": \"Contoso Dev\", \"isDefault\": true}"
expect = ["Contoso Dev"]

[[rules]]
id = "signed-in-user"
description = "The user or service principal az is signed in as"
regex = '''(?i)"name"\s*:\s*"((?:[^"\\]|\\.){1,})"'''
secretGroup = 1
label = "USER"
within = '''(?i)"type"\s*:\s*"(?:user|servicePrincipal)"'''
remember = "distinctive"
keywords = ["user", "serviceprincipal"]

matrix = false
[[rules.tests]]
input = "{\"user\": {\"name\": \"jordan.fake@fabrikamq.example\", \"type\": \"user\"}}"
expect = ["jordan.fake@fabrikamq.example"]

[[rules]]
id = "identity-email"
description = "The sign-in name or email in an identity record"
regex = '''(?i)"(?:uniqueName|userPrincipalName|principalName|mail|mailAddress|directoryAlias)"\s*:\s*"([^"\\\s]{1,200}@[^"\\\s]{1,200})"'''
secretGroup = 1
label = "EMAIL"
remember = "distinctive"
keywords = ["uniquename", "principalname", "mail"]

matrix = false
[[rules.tests]]
input = "{\"mailAddress\": \"jordan.fake@fabrikamq.example\"}"
expect = ["jordan.fake@fabrikamq.example"]

# --- az ad user / signed-in-user (Microsoft Graph user records) -------------------

[[rules]]
id = "graph-user-id"
description = "The object id of a Graph user record"
regex = '''(?i)"id"\s*:\s*"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"'''
secretGroup = 1
label = "OBJECT-ID"
within = '''(?i)"userPrincipalName"\s*:'''
keywords = ["userprincipalname"]

matrix = false
[[rules.tests]]
input = "{\"id\": \"00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c\", \"userPrincipalName\": \"jordan.fake@fabrikamq.example\"}"
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]

[[rules]]
id = "graph-user-detail"
description = "Job, office and address fields of a Graph user record"
regex = '''(?i)"(?:jobTitle|officeLocation|department|streetAddress|city|state|postalCode|country|usageLocation|employeeId)"\s*:\s*"((?:[^"\\]|\\.){1,})"'''
secretGroup = 1
label = "USER-DETAIL"
within = '''(?i)"userPrincipalName"\s*:'''
keywords = ["userprincipalname"]

matrix = false
[[rules.tests]]
input = "{\"jobTitle\": \"Lead Fakesmith\", \"userPrincipalName\": \"jordan.fake@fabrikamq.example\"}"
expect = ["Lead Fakesmith"]

[[rules]]
id = "graph-company"
description = "companyName: the employer"
regex = '''(?i)"companyName"\s*:\s*"((?:[^"\\]|\\.){1,})"'''
secretGroup = 1
label = "EMPLOYER"
remember = "any"
keywords = ["companyname"]

matrix = false
[[rules.tests]]
input = "{\"companyName\": \"Fabrikam Q Ltd\"}"
expect = ["Fabrikam Q Ltd"]

[[rules]]
id = "phone"
description = "A phone number in a Graph user record (mobilePhone, businessPhones)"
regex = '''(?i)"(\+?[0-9][0-9 ().-]{5,20}[0-9])"'''
secretGroup = 1
label = "PHONE"
within = '''(?i)"(?:mobilePhone|businessPhones|faxNumber)"\s*:'''
keywords = ["phone", "faxnumber"]

matrix = false
[[rules.tests]]
input = "{\"mobilePhone\": \"+44 7700 900123\"}"
expect = ["+44 7700 900123"]

[[rules]]
id = "identity-guids"
description = "A person's id, originId and directory domain in an identity record: each points at one person"
regex = '''(?i)"(?:id|originId|localId|domain)"\s*:\s*"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"'''
secretGroup = 1
label = "IDENTITY-ID"
within = '''(?i)"(?:uniqueName|principalName|userPrincipalName|mailAddress)"\s*:'''
remember = "distinctive"
keywords = ["uniquename", "principalname"]

matrix = false
[[rules.tests]]
input = "{\"originId\": \"00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c\", \"principalName\": \"jordan.fake@fabrikamq.example\"}"
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]

[[rules]]
id = "user-entitlement-id"
description = "The id of a member in az devops user list: one per person"
regex = '''(?i)"id"\s*:\s*"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"'''
secretGroup = 1
label = "IDENTITY-ID"
within = '''(?i)"lastAccessedDate"\s*:'''
remember = "distinctive"
keywords = ["lastaccesseddate"]

matrix = false
[[rules.tests]]
input = "{\"id\": \"00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c\", \"lastAccessedDate\": \"2026-01-01\"}"
expect = ["00000001-7b4d-4e8a-9c21-5d6e7f8a9b0c"]

# --- az pipelines variable-group list ---------------------------------------------

[[rules]]
id = "pipeline-variable"
description = "The value of each variable in a pipeline variable group: \"name\": {\"value\": \"…\"}, with or without isSecret"
regex = '''(?i)"[^"]+"\s*:\s*\{[^{}]*?"value"\s*:\s*"((?:[^"\\]|\\.)+)"'''
secretGroup = 1
label = "PIPELINE-VAR"
remember = "distinctive"
keywords = ["\"value\""]

matrix = false
[[rules.tests]]
input = "{\"variables\": {\"DbPass\": {\"value\": \"Zq8vFakeVar42\"}}}"
expect = ["Zq8vFakeVar42"]

[[rules]]
id = "directory-alias"
description = "directoryAlias in an Azure DevOps user record: a short sign-in name with no @"
regex = '''(?i)"directoryAlias"\s*:\s*"((?:[^"\\]|\\.){2,})"'''
secretGroup = 1
label = "USER"
remember = "any"
keywords = ["directoryalias"]

matrix = false
[[rules.tests]]
input = "{\"directoryAlias\": \"jquillfake\"}"
expect = ["jquillfake"]

[[rules]]
id = "ado-org-ssh"
description = "The org in an Azure Repos SSH URL: ssh.dev.azure.com:v3/<org>/..."
regex = '''(?i)(?:ssh\.dev\.azure\.com|vs-ssh\.visualstudio\.com):v3/([^/\s"']{1,60})/'''
secretGroup = 1
label = "ORG"
remember = "any"
keywords = ["ssh.dev.azure.com", "vs-ssh.visualstudio"]

matrix = false
[[rules.tests]]
input = "git@ssh.dev.azure.com:v3/fabrikamq/Northwind/northwind-api"
expect = ["fabrikamq"]

[[rules]]
id = "ado-project-ssh"
description = "The project in an Azure Repos SSH URL: ssh.dev.azure.com:v3/<org>/<project>/..."
regex = '''(?i)(?:ssh\.dev\.azure\.com|vs-ssh\.visualstudio\.com):v3/[^/\s"']{1,60}/([^/\s"']{1,64})/'''
secretGroup = 1
label = "PROJECT"
remember = "any"
keywords = ["ssh.dev.azure.com", "vs-ssh.visualstudio"]

matrix = false
[[rules.tests]]
input = "git@ssh.dev.azure.com:v3/fabrikamq/Northwind/api"
expect = ["Northwind"]

# --- Second review: more Azure shapes -------------------------------------------

[[rules]]
id = "sign-in-name"
description = "A sign-in name in an identity record, with or without an @ (DOMAIN\\user)"
regex = '''(?i)"(?:uniqueName|principalName|userPrincipalName)"\s*:\s*"((?:[^"\\]|\\.){2,})"'''
secretGroup = 1
label = "USER"
remember = "distinctive"
keywords = ["uniquename", "principalname"]

matrix = false
[[rules.tests]]
input = "{\"principalName\": \"FABRIKAMQ\\\\jquillfake\"}"
expect = ["FABRIKAMQ\\\\jquillfake"]

[[rules]]
id = "ado-org-visualstudio"
description = "The org in the older <org>.visualstudio.com Azure DevOps URLs"
regex = '''(?i)(?:^|[^a-z0-9-])([a-z0-9][a-z0-9-]{0,49})\.visualstudio\.com'''
secretGroup = 1
label = "ORG"
# Microsoft's own hosts under visualstudio.com, not an org.
except = '''(?i)^(?:vs-ssh|pkgs|app|marketplace|vssps|aex|vsaex|vsrm|status|vsassets|spsprod[a-z]{2,6}[0-9]{0,3}|login|management)$'''
remember = "any"
keywords = ["visualstudio.com"]

matrix = false
[[rules.tests]]
input = "https://fabrikamq.visualstudio.com/Proj"
expect = ["fabrikamq"]
[[rules.tests]]
input = "https://marketplace.visualstudio.com/items"
expect = []

[[rules]]
id = "keyvault-secret-value"
description = "The value of az keyvault secret show (a record whose id holds /secrets/)"
regex = '''(?i)"value"\s*:\s*"((?:[^"\\]|\\.)+)"'''
secretGroup = 1
label = "SECRET"
within = '''(?i)/secrets/'''
keywords = ["/secrets/"]

matrix = false
[[rules.tests]]
input = "{\"id\": \"https://kv.vault.azure.net/secrets/db/1\", \"value\": \"Zq8vFakeKv42\"}"
expect = ["Zq8vFakeKv42"]

[[rules]]
id = "account-key-value"
description = "The value of az storage account keys list and similar keyName records"
regex = '''(?i)"value"\s*:\s*"((?:[^"\\]|\\.)+)"'''
secretGroup = 1
label = "KEY"
within = '''(?i)"keyName"\s*:'''
keywords = ["keyname"]

matrix = false
[[rules.tests]]
input = "{\"keyName\": \"key1\", \"value\": \"RmFrZUtleQ==\"}"
expect = ["RmFrZUtleQ=="]

[[rules]]
id = "service-key"
description = "primaryKey, secondaryKey and *MasterKey fields (Cosmos DB, Service Bus, Event Hubs keys list)"
regex = '''(?i)"[A-Za-z]*(?:MasterKey|primaryKey|secondaryKey)"\s*:\s*"((?:[^"\\]|\\.){16,})"'''
secretGroup = 1
label = "KEY"
keywords = ["masterkey", "primarykey", "secondarykey"]

matrix = false
[[rules.tests]]
input = "{\"primaryMasterKey\": \"RmFrZU1hc3RlcktleTEyMzQ=\"}"
expect = ["RmFrZU1hc3RlcktleTEyMzQ="]

[[rules]]
id = "ado-project-visualstudio"
description = "The project in <org>.visualstudio.com/<project>/ URLs"
regex = '''(?i)[a-z0-9][a-z0-9-]{0,49}\.visualstudio\.com/(?:DefaultCollection/)?([^/\s"'?#_][^/\s"'?#]{0,63})'''
secretGroup = 1
label = "PROJECT"
remember = "any"
keywords = ["visualstudio.com/"]

matrix = false
[[rules.tests]]
input = "https://fabrikamq.visualstudio.com/Northwind/_git/x"
expect = ["Northwind"]

[[rules]]
id = "ado-org-artifacts"
description = "The org in Azure Artifacts feed URLs: pkgs.dev.azure.com/<org>/"
regex = '''(?i)pkgs\.dev\.azure\.com/([a-z0-9][a-z0-9-]{0,49})'''
secretGroup = 1
label = "ORG"
remember = "any"
keywords = ["pkgs.dev.azure.com"]

matrix = false
[[rules.tests]]
input = "https://pkgs.dev.azure.com/fabrikamq/_packaging/feed/npm/registry/"
expect = ["fabrikamq"]

[[rules]]
id = "ado-org-artifacts-vs"
description = "The org in older Azure Artifacts feed URLs: <org>.pkgs.visualstudio.com"
regex = '''(?i)(?:^|[^a-z0-9-])([a-z0-9][a-z0-9-]{0,49})\.pkgs\.visualstudio\.com'''
secretGroup = 1
label = "ORG"
remember = "any"
keywords = ["pkgs.visualstudio.com"]

matrix = false
[[rules.tests]]
input = "https://fabrikamq.pkgs.visualstudio.com/_packaging"
expect = ["fabrikamq"]
