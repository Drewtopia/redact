expect = ["Codex", "Gemini", "Jordan Quillfake (aider)"]

[[rules]]
id = "git-config-user"
description = "user.name in git config -l"
regex = '''(?m)^user\.name=(.{2,200})$'''
secretGroup = 1
label = "PERSON"
remember = "distinctive"
keywords = ["user.name"]

matrix = false
[[rules.tests]]
input = "user.name=Jordan Quillfake\nuser.email=jordan.fake@fabrikamq.example"
expect = ["Jordan Quillfake"]

[[rules]]
id = "github-login"
description = "The login of a GitHub user record, then the same login everywhere else"
regex = '''(?i)"login"\s*:\s*"([A-Za-z0-9-]{1,39})"'''
secretGroup = 1
label = "USER"
within = '''(?i)"(?:html_url|is_bot)"\s*:'''
remember = "any"
keywords = ["\"login\""]

matrix = false
[[rules.tests]]
input = "{\"login\": \"jqfake\", \"html_url\": \"https://github.com/jqfake\"}"
expect = ["jqfake"]

[[rules]]
id = "github-profile"
description = "The name, company, blog, location, bio and handle in a GitHub user record"
regex = '''(?i)"(?:name|company|blog|location|bio|twitter_username)"\s*:\s*"((?:[^"\\]|\\.){1,})"'''
secretGroup = 1
label = "PROFILE"
within = '''(?i)"(?:site_admin|public_repos|user_view_type|is_bot)"\s*:'''
remember = "distinctive"
keywords = ["site_admin", "public_repos", "is_bot"]

matrix = false
[[rules.tests]]
input = "{\"login\": \"jqfake\", \"name\": \"Jordan Quillfake\", \"site_admin\": false}"
expect = ["Jordan Quillfake"]
