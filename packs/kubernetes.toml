# Built-in pack: Kubernetes Secrets and kubeconfig credentials.
schema_version = 1
id = "kubernetes"
description = "The values of a Kubernetes Secret's data (YAML and JSON), and client keys in a kubeconfig"
keywords = ["kind: secret", "\"kind\": \"secret\"", "\"kind\":\"secret\"", "client-key-data"]

[[rules]]
id = "secret-data-yaml"
description = "A base64 value on an indented line of a Secret (kubectl get secret -o yaml)"
regex = '''(?m)^[ \t]+[A-Za-z0-9_.-]+:[ \t]+([A-Za-z0-9+/]{8,}={0,2})[ \t]*$'''
secretGroup = 1
label = "SECRET"
keywords = ["kind: secret"]

[[rules]]
id = "secret-data-json"
description = "A base64 value in a Secret (kubectl get secret -o json)"
regex = '''(?i)"[^"]+"\s*:\s*"([A-Za-z0-9+/]{8,}={0,2})"'''
secretGroup = 1
label = "SECRET"
keywords = ["\"kind\": \"secret\"", "\"kind\":\"secret\""]

[[rules]]
id = "client-key-data"
description = "A client key in a kubeconfig (client-key-data)"
regex = '''(?i)client-key-data"?\s*:\s*["']?([A-Za-z0-9+/=]{16,})'''
secretGroup = 1
label = "PRIVATE-KEY"
keywords = ["client-key-data"]
