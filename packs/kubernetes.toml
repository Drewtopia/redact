# Built-in pack: Kubernetes Secrets and kubeconfig credentials.
schema_version = 1
id = "kubernetes"
description = "The values of a Kubernetes Secret's data (YAML and JSON), and client keys in a kubeconfig"
keywords = ["kind: secret", "kind: \"secret\"", "kind: 'secret'", "\"kind\": \"secret\"", "\"kind\":\"secret\"", "client-key-data"]

[[rules]]
id = "secret-data-yaml"
description = "A base64 value on an indented line of a Secret (kubectl get secret -o yaml)"
regex = '''(?m)^[ \t]+[A-Za-z0-9_.-]+:[ \t]+([A-Za-z0-9+/]{8,}={0,2})[ \t]*$'''
secretGroup = 1
label = "SECRET"
keywords = ["kind: secret", "kind: \"secret\"", "kind: 'secret'"]

matrix = false
[[rules.tests]]
input = "apiVersion: v1\nkind: Secret\ndata:\n  password: RmFrZVBhc3N3b3Jk\n"
expect = ["RmFrZVBhc3N3b3Jk"]

[[rules]]
id = "secret-data-json"
description = "A base64 value in a Secret (kubectl get secret -o json)"
regex = '''(?i)"[^"]+"\s*:\s*"([A-Za-z0-9+/]{8,}={0,2})"'''
withinKey = '''^(?:data|stringData)$'''
secretGroup = 1
label = "SECRET"
keywords = ["\"kind\": \"secret\"", "\"kind\":\"secret\""]

matrix = false
[[rules.tests]]
input = "{\"kind\": \"Secret\", \"data\": {\"password\": \"RmFrZVBhc3N3b3Jk\"}, \"metadata\": {\"name\": \"sample12345\"}}"
expect = ["RmFrZVBhc3N3b3Jk"]

[[rules]]
id = "client-key-data"
description = "A client key in a kubeconfig (client-key-data)"
regex = '''(?i)client-key-data"?\s*:\s*["']?([A-Za-z0-9+/=]{16,})'''
secretGroup = 1
label = "SECRET"
keywords = ["client-key-data"]

matrix = false
[[rules.tests]]
input = "    client-key-data: LS0tLS1CRUdJTiBGQUtFIEtFWS0tLS0t"
expect = ["LS0tLS1CRUdJTiBGQUtFIEtFWS0tLS0t"]
